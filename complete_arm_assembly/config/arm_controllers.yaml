controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        joint_1:            {kp: 100.0, kd: 5.0,  ki: 0.5,  max_integral_error: 1.0}
        joint_2:            {kp: 100.0, kd: 5.0,  ki: 0.5,  max_integral_error: 1.0}
        joint_3:            {kp: 80.0,  kd: 4.0,  ki: 0.3,  max_integral_error: 1.0}
        joint_4:            {kp: 60.0,  kd: 3.0,  ki: 0.3,  max_integral_error: 1.0}
        joint_5:            {kp: 40.0,  kd: 2.0,  ki: 0.1,  max_integral_error: 0.5}
        left_finger_joint:  {kp: 20.0,  kd: 10.0, ki: 0.1,  max_integral_error: 0.05}
        right_finger_joint: {kp: 20.0,  kd: 10.0, ki: 0.1,  max_integral_error: 0.05}

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
