controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        joint_1:            {kp: 40.0, kd: 1.5, ki: 0.05, max_integral_error: 0.5}
        joint_2:            {kp: 40.0, kd: 1.5, ki: 0.05, max_integral_error: 0.5}
        joint_3:            {kp: 30.0, kd: 1.0, ki: 0.05, max_integral_error: 0.5}
        joint_4:            {kp: 25.0, kd: 1.0, ki: 0.05, max_integral_error: 0.5}
        joint_5:            {kp: 15.0, kd: 0.5, ki: 0.01, max_integral_error: 0.2}
        left_finger_joint:  {kp: 2.0,  kd: 5.0, ki: 0.0,  max_integral_error: 0.01}
        right_finger_joint: {kp: 2.0,  kd: 5.0, ki: 0.0,  max_integral_error: 0.01}

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0