# gripper_joint_bridge: converts the driver's 'gripper' angle (rad) to left_finger_joint (m).
# Calibrate once: read the gripper angle from /joint_states fully closed and fully open, and
# measure the gap between the pad faces at the fingertips (calipers) at each.
gripper_joint_bridge:
  ros__parameters:
    gripper_rad_closed: 0.0       # TODO: /joint_states 'gripper' value, fully closed
    gripper_rad_open: 1.0         # TODO: value fully open
    gap_closed_m: 0.0             # TODO: fingertip gap when closed (m)
    gap_open_m: 0.08              # TODO: fingertip gap when open (m)
    cad_gap_m: 0.0617             # fingertip gap in the URDF's zero pose (measured from the meshes)
    finger_lower: -0.024          # left_finger_joint limits from the URDF
    finger_upper: 0.02
